<!DOCTYPE html>
<html>
<head>
  <title>Portfolio Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      position: relative;
    }

    /* BACKGROUND */
    body::before {
      content: "";
      position: fixed;
      top: -20px;
  left: -20px;
  width: calc(100% + 40px);
  height: calc(100% + 40px);
      background: url("https://plus.unsplash.com/premium_photo-1742202420319-e933c71d4495?q=80&w=1170&auto=format&fit=crop") no-repeat center;
      background-size: cover;
      filter: blur(7px);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.7);
      z-index: -1;
    }

    h1 {
      text-align: center;
      padding-top: 10px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    /* CARD */
    .card {
      background: rgba(76, 187, 23, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5f5;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-grid > div {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: span 2;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* BUTTON */
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: rgb(76, 187, 23);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(76,187,23,0.4);
    }

    button:hover {
      background: rgb(56, 150, 20);
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    /* SECTION TITLES */
    .section-title {
      margin-top: 25px;
      margin-bottom: 5px;
      color: rgb(76, 187, 23);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(76, 187, 23, 0.3);
      padding-bottom: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .metric {
      margin: 10px 0;
    }

    #results {
      display: none;
    }

    /* LOADER */
    .loader {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 10, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
    }

    .spinner {
      border: 6px solid rgba(76, 187, 23, 0.2);
      border-top: 6px solid rgb(76, 187, 23);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    .loader-text {
      color: #bbf7d0;
      font-size: 16px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>

<h1>PORTFOLIO COMPARISON DASHBOARD</h1>

<div class="container">

  <div class="card">
    <h2>Enter Allocation</h2>

    <div class="form-grid">

      <div class="full-width">
        <label>Portfolio Amount (₹)</label>
        <input id="portfolio">
      </div>

      <div class="full-width section-title">Asset Allocation</div>

      <div><label>Equity (%)</label><input id="equity"></div>
      <div><label>Debt (%)</label><input id="debt"></div>
      <div><label>Gold (%)</label><input id="gold"></div>
      <div><label>Cash (%)</label><input id="cash"></div>

      <div class="full-width section-title">Equity Breakdown</div>

      <div><label>Nifty 50 (%)</label><input id="nifty50"></div>
      <div><label>Midcap (%)</label><input id="midcap"></div>

      <div class="full-width">
        <label>Smallcap (%)</label>
        <input id="smallcap">
      </div>

    </div>

    <button id="compareBtn" onclick="calculate()">
      <span id="btnText">Compare</span>
      <span id="btnLoader" class="btn-spinner"></span>
    </button>

  </div>

  <div id="results">

    <div class="grid">

      <div class="card">
        <h2>Static Allocation</h2>
        <div class="metric">Std Dev: <span id="s_std"></span></div>
        <div class="metric">Return: <span id="s_rm"></span></div>
        <div class="metric">Sharpe: <span id="s_sharpe"></span></div>
        <div class="metric">Treynor: <span id="s_treynor"></span></div>
      </div>

      <div class="card">
        <h2>Dynamic Allocation</h2>
        <div class="metric">Std Dev: <span id="d_std"></span></div>
        <div class="metric">Return: <span id="d_rm"></span></div>
        <div class="metric">Sharpe: <span id="d_sharpe"></span></div>
        <div class="metric">Treynor: <span id="d_treynor"></span></div>
      </div>

    </div>

    <div class="card">
      <canvas id="barChart"></canvas>
    </div>

  </div>

</div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Calculating portfolio performance...</div>
</div>

<script>

let chart;

function calculate() {

  let btn = document.getElementById("compareBtn");
  let text = document.getElementById("btnText");
  let loaderBtn = document.getElementById("btnLoader");

  btn.disabled = true;
  text.innerText = "Calculating...";
  loaderBtn.style.display = "inline-block";

  document.getElementById("loader").style.display = "flex";
  document.getElementById("results").style.display = "none";

  fetch("https://script.google.com/macros/s/AKfycbztYIndPItUqOh8d8afBJNgic1zsGAB3jr16CW5rMNe7I36zOMQa8gDqCJ68fstlqUW/exec", {
    method: "POST",
    body: JSON.stringify({
      nifty50: nifty50.value / 100,
      midcap: midcap.value / 100,
      smallcap: smallcap.value / 100,
      equity: equity.value / 100,
      debt: debt.value / 100,
      gold: gold.value / 100,
      cash: cash.value / 100,
      portfolio: portfolio.value
    })
  })
  .then(res => res.json())
  .then(data => {

    function dec(v){ return Number(v).toFixed(2); }
    function pct(v){ return (Number(v)*100).toFixed(2) + "%"; }

    s_std.innerText = pct(data.static.stdDev);
    s_rm.innerText = pct(data.static.rm);
    s_sharpe.innerText = dec(data.static.sharpe);
    s_treynor.innerText = dec(data.static.treynor);

    d_std.innerText = pct(data.dynamic.stdDev);
    d_rm.innerText = pct(data.dynamic.rm);
    d_sharpe.innerText = dec(data.dynamic.sharpe);
    d_treynor.innerText = dec(data.dynamic.treynor);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("barChart"), {
      type: 'bar',
      data: {
        labels: ["Std Dev", "Return", "Sharpe", "Treynor"],
        datasets: [
          {
            label: "Static",
            data: [data.static.stdDev, data.static.rm, data.static.sharpe, data.static.treynor],
            backgroundColor: "rgba(76, 187, 23, 0.6)",
            borderColor: "rgb(76, 187, 23)",
            borderWidth: 1,
            borderRadius: 6
          },
          {
            label: "Dynamic",
            data: [data.dynamic.stdDev, data.dynamic.rm, data.dynamic.sharpe, data.dynamic.treynor],
            backgroundColor: "rgba(134, 239, 172, 0.6)",
            borderColor: "rgb(134, 239, 172)",
            borderWidth: 1,
            borderRadius: 6
          }
        ]
      },
      options: {
        plugins: {
          legend: {
            labels: {
              color: "#bbf7d0"
            }
          }
        },
        scales: {
          x: {
            ticks: { color: "#e2e8f0" },
            grid: { color: "rgba(255,255,255,0.05)" }
          },
          y: {
            ticks: { color: "#e2e8f0" },
            grid: { color: "rgba(255,255,255,0.05)" }
          }
        }
      }
    });

    document.getElementById("loader").style.display = "none";
    document.getElementById("results").style.display = "block";

    btn.disabled = false;
    text.innerText = "Compare";
    loaderBtn.style.display = "none";

  });

}

</script>

</body>
</html>
